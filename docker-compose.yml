services:
  mongodb:
    image: mongo:6.0
    container_name: yapit-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: yapit
    volumes:
      - mongodb_data:/data/db
    networks:
      - yapit-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yapit-backend
    ports:
      - "5001:5000"   # host:container
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/yapit?authSource=admin
      JWT_SECRET: your_production_jwt_secret
      CORS_ORIGIN: "*"
    depends_on:
      - mongodb
    networks:
      - yapit-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: yapit-web
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5001
    depends_on:
      - backend
    networks:
      - yapit-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  yapit-network:
    driver: bridge
